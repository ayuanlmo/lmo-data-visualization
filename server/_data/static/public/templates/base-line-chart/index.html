<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>基础多折线图</title>
    <link href="../../styles/animate.min.css" rel="stylesheet">
    <link href="../../styles/default.css" rel="stylesheet">
    <style>
        .value-box {
            width: 100%;
            font-size: 28px;
            display: flex;
            padding: 120px 0 0 160px;
            user-select: none !important;
        }

        #app {
            margin-top: 0 !important;
        }

        .value-item {
            margin-right: 2.5rem;
        }

        .value-item-value {
            font-size: 60px;
            padding-right: 10px;
        }

        .value-item-label {
            color: #9b9b9b;
        }

        .value-item-unit {
            font-size: 24px;
        }
    </style>
</head>
<body>
<script src="../../scripts/echarts.min.js"></script>
<script src="../../scripts/d3.js"></script>
<script src="../../scripts/interact.min.js"></script>
<div id="template">
    <div class="animated fadeInDown" id="main-title">
        <div class="text-value" contenteditable></div>
    </div>
    <div class="animated fadeInDown" id="sub-title">
        <div class="text-value" contenteditable></div>
    </div>
    <div class="animated fadeInDown" id="from-source">
        <div class="text-value" contenteditable></div>
    </div>
    <div class="value-box">

    </div>
    <div id="logo"></div>
    <div id="app" style="width: 100vw;height: calc(100vh - 268px);user-select: none;margin-top: 120px;">

    </div>
</div>
<!--__LMO_SERVER_AUDIO_RENDER_TAG-->
</body>
<script src="./index.js" type="module"></script>
</html>
