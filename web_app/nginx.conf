server {
    listen 80;
    server_name _;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";
    root /usr/share/nginx/html;
    index index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://server_app:3000/;

    }

    # WebSocket：设计页 new WebSocket("ws://<host>/connect")。这是唯一需要经 nginx 暴露的 WS。
    # proxy_pass 末尾不写斜杠：location /connect 不带尾斜杠时，写 /connect/ 会让 nginx
    # 把匹配段整体替换成 /connect/，上游收到的是 /connect/。Fastify 默认不忽略尾斜杠
    # （Express 会），于是落到 notFound 处理器；而本项目封套把 404 也包成 HTTP 200，
    # 握手失败在日志里看着完全正常，极难排查。
    #
    # 注：服务端另有一条内部 WS `/template`，**不要**在这里代理。它只在模板页面的
    # 合成模式（URL 带 `?__type=h`，见 BaseTemplateMethods.isSynthesisMode）下才连接，
    # 而那种页面是由 server 进程内的 headless Chrome 从
    # `http://server_app:3000/static/templates/<id>/index.html?__type=h` 直接加载的，
    # 不经 nginx；设计页预览 iframe 不带 `__type=h`，走 postMessage，也不建 WS。
    # 暴露它只会把一个无鉴权的内部中止渲染通道白白开给公网。
    location /connect {
        proxy_pass http://server_app:3000/connect;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
